<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Main gradient: violet → indigo -->
    <linearGradient id="g1" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <!-- Inner glow gradient -->
    <linearGradient id="g2" x1="20" y1="18" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <!-- Outer ring subtle stroke gradient -->
    <linearGradient id="g3" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
    <!-- Glow filter for center mark -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Hexagon background shape (pointed top) -->
  <path
    d="M32 3 L57 17.5 L57 46.5 L32 61 L7 46.5 L7 17.5 Z"
    fill="url(#g1)"
    filter="url(#shadow)"
  />

  <!-- Inner hexagon ring (lighter, subtle depth) -->
  <path
    d="M32 8.5 L52.5 19.75 L52.5 42.25 L32 53.5 L11.5 42.25 L11.5 19.75 Z"
    fill="none"
    stroke="url(#g3)"
    stroke-width="1"
  />

  <!-- Circuit node dots — top-left -->
  <circle cx="18" cy="22" r="2.2" fill="#ede9fe" opacity="0.55"/>
  <!-- Circuit node dots — top-right -->
  <circle cx="46" cy="22" r="2.2" fill="#ede9fe" opacity="0.55"/>
  <!-- Circuit node dots — bottom-left -->
  <circle cx="18" cy="42" r="2.2" fill="#ede9fe" opacity="0.55"/>
  <!-- Circuit node dots — bottom-right -->
  <circle cx="46" cy="42" r="2.2" fill="#ede9fe" opacity="0.55"/>

  <!-- Connecting circuit lines (subtle grid feel) -->
  <line x1="18" y1="22" x2="20.5" y2="28" stroke="#ede9fe" stroke-width="0.8" opacity="0.3"/>
  <line x1="46" y1="22" x2="43.5" y2="28" stroke="#ede9fe" stroke-width="0.8" opacity="0.3"/>
  <line x1="18" y1="42" x2="20.5" y2="36" stroke="#ede9fe" stroke-width="0.8" opacity="0.3"/>
  <line x1="46" y1="42" x2="43.5" y2="36" stroke="#ede9fe" stroke-width="0.8" opacity="0.3"/>

  <!-- Central "A" letterform — bold geometric -->
  <g filter="url(#glow)">
    <!-- Left stroke of A -->
    <path
      d="M22.5 46 L31 19 L32 17 L33 19 L41.5 46"
      stroke="url(#g2)"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Crossbar of A -->
    <line
      x1="25.5" y1="35.5"
      x2="38.5" y2="35.5"
      stroke="url(#g2)"
      stroke-width="3.5"
      stroke-linecap="round"
    />
    <!-- Top apex dot (node) -->
    <circle cx="32" cy="17.5" r="2.8" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
