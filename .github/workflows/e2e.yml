name: agentops e2e

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "artifacts/agentops/**"
      - "artifacts/api-server/**"
      - "lib/**"
      - ".github/workflows/e2e.yml"
      - "pnpm-lock.yaml"

jobs:
  workflow-detail-e2e:
    # Pin a Playwright-supported image; ubuntu-latest moved to unsupported 26.04.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agentops_test
      NODE_ENV: test
      CI: "true"
      AGENTOPS_PORT: "20962"
      API_SERVER_PORT: "8080"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        env:
          PORT: "20962"
          BASE_PATH: /
        run: pnpm run build

      - name: Enable pgvector extension
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d agentops_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Push DB schema
        run: pnpm --filter @workspace/db run push-force

      - name: Seed reference data
        run: pnpm --filter @workspace/api-server run seed

      - name: Install Playwright browsers (with system deps)
        run: pnpm --filter @workspace/agentops exec playwright install --with-deps chromium

      - name: Start API server
        env:
          PORT: ${{ env.API_SERVER_PORT }}
        run: |
          pnpm --filter @workspace/api-server run start > /tmp/api-server.log 2>&1 &
          echo $! > /tmp/api-server.pid
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${API_SERVER_PORT}/api/healthz" >/dev/null; then
              echo "api-server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "api-server failed to start"; cat /tmp/api-server.log; exit 1

      - name: Start agentops web
        env:
          PORT: ${{ env.AGENTOPS_PORT }}
          BASE_PATH: "/"
          # Proxy /api -> api-server so the same origin serves both the SPA
          # and its API calls (the React client uses relative /api/* URLs).
          API_PROXY_TARGET: http://localhost:${{ env.API_SERVER_PORT }}
        run: |
          pnpm --filter @workspace/agentops run dev > /tmp/agentops.log 2>&1 &
          echo $! > /tmp/agentops.pid
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${AGENTOPS_PORT}/" >/dev/null; then
              echo "agentops up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "agentops failed to start"; cat /tmp/agentops.log; exit 1

      - name: Verify /api is reachable through the SPA origin
        run: |
          curl -sfS "http://localhost:${AGENTOPS_PORT}/api/healthz" >/dev/null

      - name: Run Playwright e2e tests
        env:
          E2E_BASE_URL: http://localhost:${{ env.AGENTOPS_PORT }}
        run: pnpm --filter @workspace/agentops run test:e2e

      - name: Save demo presentation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-presentation-screenshots
          path: artifacts/agentops/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: artifacts/agentops/playwright-report
          if-no-files-found: ignore

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            /tmp/api-server.log
            /tmp/agentops.log
          if-no-files-found: ignore

      - name: Stop background services
        if: always()
        run: |
          if [ -f /tmp/agentops.pid ]; then kill "$(cat /tmp/agentops.pid)" || true; fi
          if [ -f /tmp/api-server.pid ]; then kill "$(cat /tmp/api-server.pid)" || true; fi
