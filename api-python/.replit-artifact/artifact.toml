kind = "api"
previewPath = "/api-python"
title = "Python API"
version = "1.0.0"

[[services]]
localPort = 8008
name = "Python API"
paths = ["/api-python"]

[services.development]
run = "uv run python main.py"

[services.production]

[services.production.run]
args = ["sh", "-c", "cd api-python && uv run python main.py"]

[services.production.run.env]
PORT = "8008"

[services.production.health.startup]
path = "/api-python/healthz"
