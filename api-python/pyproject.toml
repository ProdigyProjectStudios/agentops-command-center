[project]
name = "agentops-api-python"
version = "1.0.0"
description = "Standalone FastAPI service for the AgentOps platform — additive, no schema changes."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "openai>=1.50.0",
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "twilio>=9.10.9",
]

[tool.uv]
package = false
