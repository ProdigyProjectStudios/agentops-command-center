requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
]

[tool.uv]
package = false
